name: Daily YouTube Video & Transcript Sync

on:
  schedule:
    # 7:00 PM IST (13:30 UTC) & 10:00 PM IST (16:30 UTC), plus :15 & :45 queue buffers
    - cron: '15,30,45 13,16 * * *'
    # Midday check at 12:00 PM IST (06:30 UTC)
    - cron: '30 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    name: Sync Channel Uploads & Transcripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run YouTube Sync & Grounded Content Pipeline
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GOOGLE_INDEXING_CREDENTIALS: ${{ secrets.GOOGLE_INDEXING_CREDENTIALS }}
          INDEXING_SERVICE_ACCOUNT_JSON: ${{ secrets.INDEXING_SERVICE_ACCOUNT_JSON }}
        run: |
          pip install --quiet google-auth requests || true
          python3 scripts/sync_youtube_automation.py

      - name: Commit & Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [Final Third Sync]"
          
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore(sync): automated daily YouTube video & view count sync [skip ci]"
            git push origin main
            echo "✓ Changes committed and pushed to main. Vercel deployment triggered automatically."
          else
            echo "✓ Website is up-to-date. No changes to commit."
          fi

      - name: Submit Daily Indexing to Search Engines (IndexNow & Google)
        env:
          GOOGLE_INDEXING_CREDENTIALS: ${{ secrets.GOOGLE_INDEXING_CREDENTIALS }}
          INDEXING_SERVICE_ACCOUNT_JSON: ${{ secrets.INDEXING_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 scripts/notify_search_engines.py
