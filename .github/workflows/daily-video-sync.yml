name: Daily YouTube Video Sync

on:
  schedule:
    # Runs automatically twice daily at 7:00 PM IST (13:30 UTC) and 10:00 PM IST (16:30 UTC)
    - cron: '30 13,16 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from the "Actions" tab on GitHub

permissions:
  contents: write

jobs:
  sync-videos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch and Sync Latest YouTube Videos
        run: |
          python3 scripts/sync_youtube_videos.py

      - name: Commit and Push Updates
        run: |
          if [ -f "NEW_VIDEOS_FOUND.txt" ]; then
            echo "New videos found! Committing to repository..."
            rm -f NEW_VIDEOS_FOUND.txt
            git config --global user.name "Final Third Sync Bot"
            git config --global user.email "bot@finalthird.com"
            git add index.html assets/js/config.js
            git commit -m "Auto-sync: Added new YouTube video release [skip ci]"
            git push
          else
            echo "No new videos to update. Everything is up to date!"
          fi
