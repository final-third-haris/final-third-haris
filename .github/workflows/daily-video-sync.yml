name: Daily YouTube Video Sync (Legacy - Scheduled Triggers Paused)

# NOTICE: Automated scheduled triggers in this legacy workflow are paused to prevent
# race conditions and duplicate catalog writes with the master workflow:
# .github/workflows/daily_youtube_sync.yml
# This file is preserved for manual rollback if ever required.

on:
  # schedule:
  #   - cron: '15,45 13,16 * * *'
  #   - cron: '15 10 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from the "Actions" tab on GitHub if explicitly needed

permissions:
  contents: write

jobs:
  sync-videos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch and Sync Latest YouTube Videos
        run: |
          python3 scripts/sync_youtube_videos.py

      - name: Commit and Push Updates
        run: |
          if [ -f "NEW_VIDEOS_FOUND.txt" ]; then
            echo "Updates found! Committing to repository..."
            rm -f NEW_VIDEOS_FOUND.txt
            git config --global user.name "Final Third Sync Bot"
            git config --global user.email "bot@finalthird.com"
            git add index.html assets/js/config.js scripts/sync_youtube_videos.py
            git commit -m "Auto-sync: Updated YouTube releases and live view counts"
            git push
            echo "Successfully pushed updates to main branch!"
          else
            echo "No new videos or view updates. Everything is up to date!"
          fi
